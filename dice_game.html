<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChaosKey | Cinematic Dice</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#050508; color:#eee; font-family:'IBM Plex Mono',monospace; overflow:hidden; height:100vh; }
    canvas { display:block; width:100vw; height:100vh; position:fixed; top:0; left:0; }

    /* HUD */
    #hud { position:fixed; inset:0; pointer-events:none; padding:40px; display:flex; flex-direction:column; justify-content:space-between; z-index:10; }
    .top-bar { display:flex; justify-content:space-between; align-items:flex-start; }
    .logo { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:4px; color:#ff4d1c; }
    .logo span { color:#fff; opacity:0.3; font-size:12px; font-family:'IBM Plex Mono'; letter-spacing:1px; display:block; }

    #result-display {
        text-align:center;
        font-family:'Bebas Neue',sans-serif;
        font-size:0px;
        color:#ff4d1c;
        letter-spacing:4px;
        transition: font-size 0.4s ease, opacity 0.4s ease;
        opacity:0;
    }

    #roll-btn {
        pointer-events:all; background:#ff4d1c; color:#000; border:none; padding:16px 60px;
        font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px; cursor:pointer;
        clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        transition: 0.3s cubic-bezier(0.2, 1, 0.3, 1);
    }
    #roll-btn:hover:not(:disabled) { background:#fff; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255,77,28,0.3); }
    #roll-btn:disabled { background:#1a1a22; color:#333; cursor:not-allowed; }

    .bottom-bar { display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; }

    /* Modal Styling */
    .modal { position:fixed; inset:0; background:rgba(0,0,0,0.92); display:flex; align-items:center; justify-content:center; z-index:100; backdrop-filter: blur(10px); }
    .modal-box { width:400px; padding:40px; border:1px solid #222; background:#0a0a0f; text-align:center; }
    .modal-box input { width:100%; padding:12px; margin:20px 0; background:#000; border:1px solid #333; color:#fff; outline:none; font-family:inherit; font-size:13px; }
    .modal-box button { background:#ff4d1c; border:none; padding:10px 30px; font-family:'Bebas Neue',sans-serif; font-size:18px; cursor:pointer; color:#000; letter-spacing:2px; }
    .modal-box button:hover { background:#fff; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

<div id="modal" class="modal">
    <div class="modal-box">
        <div class="logo">CHAOS<span>KEY — ENTROPY ENGINE</span></div>
        <p style="font-size:12px; color:#555; margin-top:12px;">Connect to SARA Hardware Entropy API</p>
        <input type="password" id="key-input" placeholder="ENTER API KEY" autocomplete="off">
        <button onclick="initApp()">INITIALIZE</button>
        <p onclick="initApp(true)" style="font-size:10px; color:#444; margin-top:16px; cursor:pointer; text-decoration:underline;">SKIP — USE PSEUDO-RANDOM</p>
    </div>
</div>

<div id="hud">
    <div class="top-bar">
        <div class="logo">CHAOS<span>DICE ENGINE V7</span></div>
        <div id="status" style="font-size:10px; color:#4ade80; text-align:right;">SYSTEM READY</div>
    </div>
    <div class="bottom-bar">
        <div id="result-display">—</div>
        <button id="roll-btn" onclick="tossDice()">ROLL THE DICE</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

<script>
let scene, camera, renderer, world, diceBody, diceMesh;
let rolling = false;
let settleCheckId = null;
let API_KEY = '';

const defaultCamPos = new THREE.Vector3(0, 9, 13);
const defaultLookAt = new THREE.Vector3(0, 0, -1);
let targetCamPos = defaultCamPos.clone();
let targetLookAt  = defaultLookAt.clone();
let currentLookAt = defaultLookAt.clone();

// BoxGeometry face order: +X, -X, +Y, -Y, +Z, -Z  →  1, 6, 2, 5, 3, 4
const FACE_NORMALS = {
    1: new CANNON.Vec3( 1,  0,  0),
    6: new CANNON.Vec3(-1,  0,  0),
    2: new CANNON.Vec3( 0,  1,  0),
    5: new CANNON.Vec3( 0, -1,  0),
    3: new CANNON.Vec3( 0,  0,  1),
    4: new CANNON.Vec3( 0,  0, -1),
};

// ─── Read which face is up from a CANNON quaternion ──────────────────────────
function topFaceFromQuat(q) {
    const up = new CANNON.Vec3(0, 1, 0);
    let best = -Infinity, result = 1;
    for (const [n, normal] of Object.entries(FACE_NORMALS)) {
        const world = q.vmult(normal);
        const dot = world.dot(up);
        if (dot > best) { best = dot; result = parseInt(n); }
    }
    return result;
}

// ─── Silent pre-simulation ────────────────────────────────────────────────────
// Runs the physics entirely in a throw-away world (no rendering).
// Returns the starting quaternion that naturally produces targetFace on top.
function findWinningStartQuat(targetFace, throwParams) {
    const { startX, startZ, vx, vy, vz, avx, avy, avz } = throwParams;

    for (let attempt = 0; attempt < 200; attempt++) {
        // Fresh hidden world
        const hw = new CANNON.World();
        hw.gravity.set(0, -25, 0);
        hw.broadphase = new CANNON.NaiveBroadphase();
        hw.solver.iterations = 20;

        const gMat = new CANNON.Material('g');
        const dMat = new CANNON.Material('d');

        const ground = new CANNON.Body({ mass: 0, material: gMat });
        ground.addShape(new CANNON.Plane());
        ground.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        hw.addBody(ground);

        const hBody = new CANNON.Body({
            mass: 0.15,
            shape: new CANNON.Box(new CANNON.Vec3(0.6, 0.6, 0.6)),
            material: dMat,
            linearDamping: 0.08,
            angularDamping: 0.08,
        });
        hw.addBody(hBody);

        hw.addContactMaterial(new CANNON.ContactMaterial(gMat, dMat, {
            friction: 0.35, restitution: 0.55,
            contactEquationStiffness: 1e7, contactEquationRelaxation: 3
        }));

        // Random starting orientation for this attempt
        const startQ = new CANNON.Quaternion();
        startQ.setFromEuler(
            Math.random() * Math.PI * 2,
            Math.random() * Math.PI * 2,
            Math.random() * Math.PI * 2
        );

        hBody.position.set(startX, 3.5, startZ);
        hBody.quaternion.copy(startQ);
        hBody.velocity.set(vx, vy, vz);
        hBody.angularVelocity.set(avx, avy, avz);

        // Step until settled (max 600 steps = 10 s at 60fps)
        const dt = 1 / 60;
        for (let step = 0; step < 600; step++) {
            hw.step(dt);
            const speed = hBody.velocity.length() + hBody.angularVelocity.length();
            if (step > 60 && speed < 0.05) break;
        }

        if (topFaceFromQuat(hBody.quaternion) === targetFace) {
            return startQ; // Found one that naturally lands correctly
        }
    }

    // Fallback: return a quaternion that directly places target face up
    // (visible snap, but only if 200 attempts all fail — extremely rare)
    const faceNorm = FACE_NORMALS[targetFace];
    const up = new CANNON.Vec3(0, 1, 0);
    const q = new CANNON.Quaternion();
    q.setFromVectors(faceNorm, up);
    return q;
}

// ─── App init ────────────────────────────────────────────────────────────────
function initApp(skip = false) {
    if (!skip) API_KEY = document.getElementById('key-input').value;
    document.getElementById('modal').style.display = 'none';
    initThree();
    initPhysics();
    animate();
    placeDiceAtRest();
}

function initThree() {
    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x050508, 14, 32);

    camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.copy(defaultCamPos);
    camera.lookAt(defaultLookAt);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x050508);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    const spot = new THREE.SpotLight(0xffffff, 2.5);
    spot.position.set(3, 18, 8);
    spot.castShadow = true;
    spot.shadow.mapSize.width = 2048;
    spot.shadow.mapSize.height = 2048;
    spot.angle = 0.45; spot.penumbra = 0.4;
    scene.add(spot);

    const rim = new THREE.PointLight(0xff4d1c, 2.5, 20);
    rim.position.set(-5, 3, -5);
    scene.add(rim);

    const fill = new THREE.PointLight(0x4488ff, 0.8, 18);
    fill.position.set(6, 4, 4);
    scene.add(fill);

    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(80, 80),
        new THREE.MeshStandardMaterial({ color: 0x0c0c12, roughness: 0.85, metalness: 0.15 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(36, 36, 0xff4d1c, 0x111118);
    grid.position.y = 0.005;
    grid.material.opacity = 0.12;
    grid.material.transparent = true;
    scene.add(grid);

    createDice();
}

function drawPips(ctx, n) {
    const pos = {
        1: [[128,128]],
        2: [[80,80],[176,176]],
        3: [[80,80],[128,128],[176,176]],
        4: [[80,80],[176,80],[80,176],[176,176]],
        5: [[80,80],[176,80],[128,128],[80,176],[176,176]],
        6: [[80,72],[176,72],[80,128],[176,128],[80,184],[176,184]]
    };
    ctx.fillStyle = '#ff4d1c';
    (pos[n] || []).forEach(([x,y]) => {
        ctx.beginPath();
        ctx.arc(x, y, n === 1 ? 22 : 17, 0, Math.PI * 2);
        ctx.fill();
    });
}

function createDice() {
    const faceOrder = [1, 6, 2, 5, 3, 4];
    const materials = faceOrder.map(n => {
        const cv = document.createElement('canvas');
        cv.width = cv.height = 256;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#13131a';
        ctx.fillRect(0, 0, 256, 256);
        const r = 28;
        ctx.beginPath();
        ctx.moveTo(r,0); ctx.lineTo(256-r,0); ctx.quadraticCurveTo(256,0,256,r);
        ctx.lineTo(256,256-r); ctx.quadraticCurveTo(256,256,256-r,256);
        ctx.lineTo(r,256); ctx.quadraticCurveTo(0,256,0,256-r);
        ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
        ctx.closePath();
        ctx.fillStyle = '#1a1a26'; ctx.fill();
        ctx.strokeStyle = 'rgba(255,77,28,0.22)'; ctx.lineWidth = 3; ctx.stroke();
        drawPips(ctx, n);
        return new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(cv), roughness: 0.18, metalness: 0.08 });
    });
    diceMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), materials);
    diceMesh.castShadow = true;
    scene.add(diceMesh);
}

function initPhysics() {
    world = new CANNON.World();
    world.gravity.set(0, -25, 0);
    world.broadphase = new CANNON.NaiveBroadphase();
    world.solver.iterations = 20;
    world.allowSleep = true;

    const groundMat = new CANNON.Material('ground');
    const diceMat   = new CANNON.Material('dice');

    const ground = new CANNON.Body({ mass: 0, material: groundMat });
    ground.addShape(new CANNON.Plane());
    ground.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(ground);

    [
        [0, 0,-11, 0, 0, 0], [0, 0, 7, 0, Math.PI, 0],
        [-7, 0, 0, 0,  Math.PI/2, 0], [7, 0, 0, 0, -Math.PI/2, 0]
    ].forEach(([x,y,z,rx,ry,rz]) => {
        const w = new CANNON.Body({ mass: 0, material: groundMat });
        w.addShape(new CANNON.Plane());
        w.position.set(x,y,z);
        w.quaternion.setFromEuler(rx,ry,rz);
        world.addBody(w);
    });

    diceBody = new CANNON.Body({
        mass: 0.15,
        shape: new CANNON.Box(new CANNON.Vec3(0.6, 0.6, 0.6)),
        material: diceMat,
        linearDamping: 0.08,
        angularDamping: 0.08,
        sleepSpeedLimit: 0.4,
        sleepTimeLimit: 0.5
    });
    world.addBody(diceBody);

    world.addContactMaterial(new CANNON.ContactMaterial(groundMat, diceMat, {
        friction: 0.35, restitution: 0.55,
        contactEquationStiffness: 1e7, contactEquationRelaxation: 3
    }));
}

function placeDiceAtRest() {
    diceBody.position.set(0, 0.6, -1);
    diceBody.velocity.set(0, 0, 0);
    diceBody.angularVelocity.set(0, 0, 0);
    diceBody.quaternion.setFromEuler(0, 0, 0);
    diceBody.sleep();
}

// ─── ChaosKey entropy ────────────────────────────────────────────────────────
async function getEntropyNumber() {
    const statusEl = document.getElementById('status');
    if (!API_KEY) {
        statusEl.textContent = "USING FALLBACK MATH.RANDOM";
        statusEl.style.color = "#e8b84b";
        return Math.floor(Math.random() * 6) + 1;
    }
    try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 10000);
        const res = await fetch("https://app-final-project.onrender.com/v1/export_key", {
            method: 'GET',
            headers: { "Authorization": `Bearer ${API_KEY}`, "ngrok-skip-browser-warning": "true" },
            signal: ctrl.signal
        });
        clearTimeout(tid);
        if (res.ok && res.headers.get("Content-Type")?.includes("application/json")) {
            const data = await res.json();
            if (data.chaos_key) {
                statusEl.textContent = "PHYSICAL ENTROPY SECURED";
                statusEl.style.color = "#4ade80";
                return Number(BigInt("0x" + data.chaos_key) % 6n) + 1;
            }
        }
        throw new Error("bad response");
    } catch(e) {
        console.error("[!]", e.message);
        statusEl.textContent = "API OFFLINE — ROLL BLOCKED";
        statusEl.style.color = "#ff4d1c";
        return null;
    }
}

function onDiceSettled(face) {
    const resultEl = document.getElementById('result-display');
    resultEl.textContent = face;
    resultEl.style.fontSize = '120px';
    resultEl.style.opacity = '1';
    document.getElementById('roll-btn').disabled = false;
    document.getElementById('roll-btn').textContent = "ROLL THE DICE";
    rolling = false;
}

// ─── Main roll ───────────────────────────────────────────────────────────────
async function tossDice() {
    if (rolling) return;
    rolling = true;

    const btn      = document.getElementById('roll-btn');
    const resultEl = document.getElementById('result-display');
    const statusEl = document.getElementById('status');

    btn.disabled = true;
    btn.textContent = "HARVESTING ENTROPY...";
    resultEl.style.opacity = '0';
    resultEl.style.fontSize = '0px';
    statusEl.textContent = "CONTACTING SARA HARDWARE...";
    statusEl.style.color = "#e8b84b";

    const targetFace = await getEntropyNumber();
    if (targetFace === null) {
        btn.disabled = false; btn.textContent = "ROLL THE DICE"; rolling = false;
        return;
    }

    if (settleCheckId) { clearInterval(settleCheckId); settleCheckId = null; }

    btn.textContent = "COMPUTING TRAJECTORY...";
    statusEl.textContent = "SIMULATING PHYSICS...";

    // Fixed throw parameters (same every roll — only quaternion changes)
    const throwParams = {
        startX: (Math.random() - 0.5) * 2,
        startZ: -4 + Math.random(),
        vx: (Math.random() - 0.5) * 2,
        vy: 2 + Math.random(),
        vz: 5 + Math.random() * 2,
        avx: (Math.random() - 0.5) * 18,
        avy: (Math.random() - 0.5) * 18,
        avz: (Math.random() - 0.5) * 18,
    };

    // Find a starting quaternion that makes physics naturally land on targetFace
    const winningQuat = findWinningStartQuat(targetFace, throwParams);

    btn.textContent = "ROLLING...";
    statusEl.textContent = "ENTROPY IN MOTION";
    statusEl.style.color = "#e8b84b";

    // Launch the real visible throw with the pre-computed quaternion
    diceBody.wakeUp();
    diceBody.type = CANNON.Body.DYNAMIC;
    diceBody.linearDamping  = 0.08;
    diceBody.angularDamping = 0.08;
    diceBody.position.set(throwParams.startX, 3.5, throwParams.startZ);
    diceBody.quaternion.copy(winningQuat);
    diceBody.velocity.set(throwParams.vx, throwParams.vy, throwParams.vz);
    diceBody.angularVelocity.set(throwParams.avx, throwParams.avy, throwParams.avz);

    // Camera pulls back wide to watch
    targetCamPos.set(0, 13, 18);
    targetLookAt.set(0, 0, -1);

    const startTime = Date.now();

    settleCheckId = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const speed   = diceBody.velocity.length() + diceBody.angularVelocity.length();

        const settled = elapsed > 2000 && speed < 0.15 && diceBody.position.y < 1.0;
        const timeout = elapsed > 8000;

        if (settled || timeout) {
            clearInterval(settleCheckId);
            settleCheckId = null;

            // No correction needed — physics already landed on the right face.
            // Cinematic close-up swoop
            const dp = diceBody.position;
            targetCamPos.set(dp.x + 1, dp.y + 3, dp.z + 3.5);
            targetLookAt.set(dp.x, dp.y + 0.3, dp.z);

            setTimeout(() => {
                onDiceSettled(targetFace);
                setTimeout(() => {
                    targetCamPos.copy(defaultCamPos);
                    targetLookAt.copy(defaultLookAt);
                }, 2500);
            }, 800);
        }
    }, 80);
}

function animate() {
    requestAnimationFrame(animate);
    world.step(1 / 60);
    if (diceMesh && diceBody) {
        diceMesh.position.copy(diceBody.position);
        diceMesh.quaternion.copy(diceBody.quaternion);
    }
    if (camera) {
        camera.position.lerp(targetCamPos, 0.05);
        currentLookAt.lerp(targetLookAt, 0.05);
        camera.lookAt(currentLookAt);
    }
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    if (!camera || !renderer) return;
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
